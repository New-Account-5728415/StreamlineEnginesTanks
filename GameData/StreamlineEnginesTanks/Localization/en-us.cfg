			#LOC_StreamlineNESD_description_mk1adapterS6     =  These streamlined fairing sections are designed to sit just ahead of engines, smoothing airflow and keeping everything behind them a little less… on fire. By guiding air cleanly around exposed engine components, they help reduce drag, improve stability at high speeds, and give your craft that sleek, “definitely designed on purpose” look engineers love. Built from lightweight yet durable materials, they can handle the intense conditions near active engines while protecting sensitive parts from heat and turbulence. Whether you’re pushing through thick atmosphere or just trying to make your spaceplane look less like a collection of spare parts, these fairings ensure your engines get the airflow they need—without all the chaos that usually comes with it.  This one comes with six side nodes
			
			#LOC_StreamlineNESD_description_wingtubeL = The engineers insisted the wing needed “more functionality,” so instead of wasting space on structure alone, each wing section now houses a pressurized transit tube running straight through its core, allowing Kerbals to move from one part of the vessel to another without ever stepping outside—perfect for mid-flight repairs, snack runs, or dramatic heroic walks during emergencies. Reinforced viewports on both the top and bottom surfaces provide stunning (and occasionally alarming) views of the sky above and the terrain rushing by below, turning every trip through the passage into an involuntary sightseeing tour. The tube is… snug… but fully pressurized and rated for most standard operations, making it ideal for connecting crew cabins, cargo sections, or that one experimental module everyone insists is totally safe, and proving once again that wings can—and probably should—do more than just keep you airborne.
			#LOC_StreamlineNESD_description_wingtubeM = The engineers insisted the wing needed “more functionality,” so instead of wasting space on structure alone, each wing section now houses a pressurized transit tube running straight through its core, allowing Kerbals to move from one part of the vessel to another without ever stepping outside—perfect for mid-flight repairs, snack runs, or dramatic heroic walks during emergencies. Reinforced viewports on both the top and bottom surfaces provide stunning (and occasionally alarming) views of the sky above and the terrain rushing by below, turning every trip through the passage into an involuntary sightseeing tour. The tube is… snug… but fully pressurized and rated for most standard operations, making it ideal for connecting crew cabins, cargo sections, or that one experimental module everyone insists is totally safe, and proving once again that wings can—and probably should—do more than just keep you airborne.
			#LOC_StreamlineNESD_description_wingtubeS = The engineers insisted the wing needed “more functionality,” so instead of wasting space on structure alone, each wing section now houses a pressurized transit tube running straight through its core, allowing Kerbals to move from one part of the vessel to another without ever stepping outside—perfect for mid-flight repairs, snack runs, or dramatic heroic walks during emergencies. Reinforced viewports on both the top and bottom surfaces provide stunning (and occasionally alarming) views of the sky above and the terrain rushing by below, turning every trip through the passage into an involuntary sightseeing tour. The tube is… snug… but fully pressurized and rated for most standard operations, making it ideal for connecting crew cabins, cargo sections, or that one experimental module everyone insists is totally safe, and proving once again that wings can—and probably should—do more than just keep you airborne.
			
			#LOC_StreamlineNESD_description_wingtubeCap     = This streamlined endcap neatly seals the open ends of wing sections with internal transit tubes, maintaining pressurization while preserving a clean aerodynamic profile. Designed to integrate seamlessly with the wing structure, it prevents unwanted airflow disruptions and keeps your crew passages properly enclosed. Whether finishing off a wingtip or terminating a passage segment, this endcap ensures your design stays both efficient and airtight—because even Kerbals prefer their corridors without a breeze.
			#LOC_StreamlineNESD_description_wingtubeDec     = This inline decoupler is designed specifically for wing-integrated transit tubes, allowing sections of your craft to separate cleanly without disrupting the internal passage system. Built to maintain alignment and structural integrity right up until staging, it ensures a smooth break when it’s time to shed weight or execute a daring escape maneuver. Whether you’re staging wing segments or adding modular flexibility to your design, this decoupler keeps things connected—right up until it very deliberately doesn’t.
			#LOC_StreamlineNESD_description_wingtubeDock    = This specialized endcap seals the terminus of a wing-integrated transit tube while incorporating a fully functional docking port, allowing your internal passage to extend seamlessly across connected vessels. Designed to maintain pressurization and structural integrity, it provides a clean aerodynamic finish while enabling crew transfer without the need for EVA—assuming the docking goes as planned. Ideal for modular spaceplanes and ambitious orbital assemblies, this part turns a simple endpoint into a gateway, because sometimes the best way forward is through another ship.
			#LOC_StreamlineNESD_description_wingtubeFairing = This streamlined wing root fairing is designed to smoothly blend wing-integrated transit tubes into the main fuselage, reducing drag while protecting the internal passage structure. Its contoured shape ensures clean airflow at the critical wing-body junction, improving stability and overall aerodynamic efficiency during high-speed flight. Built to handle structural loads and maintain pressurization continuity, it provides a solid, airtight connection between your craft’s core and its extended wing network. Perfect for advanced spaceplanes and modular designs, this fairing keeps everything flowing smoothly—both outside and inside the wing.
			
