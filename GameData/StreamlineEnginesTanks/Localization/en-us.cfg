			#LOC_StreamlineNESD_description_SCB-5        = Battery with white covering for better aircrafts, rockets and SSTOs fuel balancing. Contain 500 units of EC and can recharge itself using integrated solar panels, but have very low charge rate and can't be used as main power source for large vessels.
