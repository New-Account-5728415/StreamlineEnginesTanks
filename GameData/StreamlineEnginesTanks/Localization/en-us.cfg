		// Description

			#LOC_StreamlineNESD_description_mk1Duet      = Tailcone with two engines and integrated small fuel tank
			#LOC_StreamlineNESD_description_mk1Trio      = One more engine but less fuel
			#LOC_StreamlineNESD_description_mk1Quartet1  = Slightly heavier and overpriced than "Reliant" but more rigid and have better aerodynamics
			#LOC_StreamlineNESD_description_mk1Quartet2  = Another version of "Quartet" with different nozzles position
			#LOC_StreamlineNESD_description_mk1Sextet    = Sale! Sale! Sale!  Deal of the day!  Buy five engines and we give you another one almost for free!
			#LOC_StreamlineNESD_description_mk1Solo      = Only one nozzle, but it have steering actuators.
			#LOC_StreamlineNESD_description_mk1Sphere    = This compact vacuum engine is optimized for efficient operation in the near-zero pressure of space, delivering high specific impulse in a small, lightweight package. Its enlarged nozzle is designed to fully expand exhaust in vacuum conditions, maximizing fuel efficiency while keeping thrust requirements modest for precise orbital maneuvers. Ideal for upper stages, probes, and fine-tuned burns, it provides reliable performance where atmospheric engines fall short. When precision and efficiency matter more than raw liftoff power, this little engine excels at getting you the rest of the way.
			#LOC_StreamlineNESD_description_mk1radial1   = Enlarged and simplified version of Streamline RCS thruster, adapted for continuous working mode.
			
			#LOC_StreamlineNESD_description_mk2SoloLF    = Central booster for Mk2 engines
			#LOC_StreamlineNESD_description_mk2SoloMP    = Monopropellant engine
			
			#LOC_StreamlineNESD_description_mk2Duet      = This compact launch stage combines a small integrated fuel tank with twin engines, delivering reliable thrust right off the pad in a tightly packaged form. Designed for efficient first-stage performance, the paired engines provide balanced thrust and improved control while keeping the overall footprint minimal. Ideal for lightweight launch vehicles, boosters, or modular stacks, it simplifies staging by bundling propulsion and fuel into a single, ready-to-go unit—because sometimes the best way to get off the ground is with twice the engines and half the hassle.
			#LOC_StreamlineNESD_description_mk2Trio      = This compact launch stage combines a small integrated fuel tank with a trio of engines, delivering strong, reliable thrust right off the pad in a tightly packaged form. Designed for efficient first-stage performance, the three-engine cluster provides excellent thrust and balanced control while keeping the overall footprint minimal. Ideal for lightweight launch vehicles, boosters, or modular stacks, it simplifies staging by bundling propulsion and fuel into a single, ready-to-go unit—because sometimes the best way to get off the ground is with three times the engines and none of the fuss.
			#LOC_StreamlineNESD_description_mk2Quartet1  = This compact launch stage combines a small integrated fuel tank with four engines arranged in two closely paired clusters, delivering strong, reliable thrust right off the pad in a tightly packaged form. Designed for efficient first-stage performance, the paired layout provides solid balance and control while allowing for a more compact footprint than evenly spaced configurations. Ideal for lightweight launch vehicles, boosters, or modular stacks, it simplifies staging by bundling propulsion and fuel into a single, ready-to-go unit—because sometimes grouping your engines together is just as important as having enough of them.
			#LOC_StreamlineNESD_description_mk2Quartet2  = This compact launch stage combines a small integrated fuel tank with four equally spaced engines, delivering strong, stable thrust right off the pad in a tightly packaged form. Designed for efficient first-stage performance, the evenly distributed engine cluster provides excellent balance, smooth control, and reliable power while keeping the overall footprint minimal. Ideal for lightweight launch vehicles, boosters, or modular stacks, it simplifies staging by bundling propulsion and fuel into a single, ready-to-go unit—because sometimes the best way to lift off is with perfect symmetry and plenty of thrust.
			#LOC_StreamlineNESD_description_mk2Sextet    = This compact launch stage combines a small integrated fuel tank with six engines arranged in three closely paired clusters, delivering powerful, dependable thrust right off the pad in a tightly packaged form. Designed for efficient first-stage performance, the grouped layout provides strong balance and control while keeping the overall footprint compact and structurally efficient. Ideal for lightweight launch vehicles, boosters, or modular stacks, it simplifies staging by bundling propulsion and fuel into a single, ready-to-go unit—because sometimes the best way to lift off is with more engines working together in perfect coordination.
			
			#LOC_StreamlineNESD_description_mk2CapLF     = This streamlined fuel tank is designed to minimize drag while efficiently storing propellant, making it ideal for high-speed atmospheric and spaceplane applications. Its smooth, contoured profile helps maintain clean airflow along the craft, improving stability and overall performance during ascent and flight. Built with a balance of lightweight construction and structural strength, it integrates seamlessly with aerodynamic designs while providing reliable fuel capacity for demanding missions. Whether you’re optimizing for speed, efficiency, or style, this tank keeps your propellant where it belongs—inside the craft and out of the airstream.
			#LOC_StreamlineNESD_description_mk2CapMP     = This streamlined fuel tank is designed to minimize drag while efficiently storing propellant, making it ideal for high-speed atmospheric and spaceplane applications. Its smooth, contoured profile helps maintain clean airflow along the craft, improving stability and overall performance during ascent and flight. Built with a balance of lightweight construction and structural strength, it integrates seamlessly with aerodynamic designs while providing reliable fuel capacity for demanding missions. Whether you’re optimizing for speed, efficiency, or style, this tank keeps your propellant where it belongs—inside the craft and out of the airstream.

			#LOC_StreamlineNESD_description_mk1RCSring   = This eight high performance steering engines in one Mk-1 ring can produce four way thrust and rotation momentum, but high pressure fuel pumps and igniters consumes a lot of electricity.
			#LOC_StreamlineNESD_description_mk1RCSsingle = Single nozzle thruster in aerodynamic housing aligned in front-back direction. Have good ISP but required electricity to operate its equipment.
			#LOC_StreamlineNESD_description_mk1RCSdual   = Dual nozzles thruster in aerodynamic housing aligned in front-back direction. Have good ISP but required electricity to operate its equipment.
			#LOC_StreamlineNESD_description_mk1RCStail   = Stationary nozzles of "Streamline" engines can't be used for steering. To compensate it, this tail section have a four high power thrusters. Be careful, igniters and high performance fuel pumps required lot of electricity, so don't forget to add a little more batteries!       NOTE! to prevent rocket shake and wasting fuel reduce Thrust Limiter slider!

			#LOC_StreamlineNESD_description_mk1cone1     = This streamlined nosecone features a clean, forward-pointing profile designed to cut smoothly through the atmosphere while reducing drag and improving overall stability at high speeds. Its straight-ahead orientation provides a balanced aerodynamic shape that integrates easily with fuselages and intake systems, helping maintain consistent airflow over the craft. Built to handle the stresses of both ascent and high-speed flight, it protects underlying components while contributing to a sleek, efficient design. Whether you’re refining a spaceplane or optimizing a high-performance aircraft, this nosecone keeps things pointed in the right direction—literally and aerodynamically.
			#LOC_StreamlineNESD_description_mk1cone2     = This streamlined nosecone features a subtly offset profile, with its tip angled about 10 degrees off center to fine-tune airflow and add a distinctive aerodynamic character. The slight cant can help redirect airflow or accommodate specialized layouts, while still maintaining low drag and stable performance at high speeds. Designed to integrate smoothly with fuselages and intake systems, it protects internal components while contributing to a sleek, purposeful look. Whether you’re experimenting with unconventional designs or dialing in a unique spaceplane configuration, this nosecone proves that sometimes a small angle makes a big difference.
			#LOC_StreamlineNESD_description_mk1cone3     = This streamlined nosecone features a pronounced offset profile, with its tip angled about 20 degrees off center to aggressively redirect airflow and support unconventional craft layouts. The sharper cant introduces a distinctive aerodynamic character while still maintaining reasonable drag characteristics and stability at speed. Designed to integrate with fuselages and specialized intake or sensor arrangements, it protects internal components while enabling creative design solutions. Ideal for experimental spaceplanes and bold engineering concepts, this nosecone shows that sometimes pushing the angle a bit further opens up entirely new possibilities.

			#LOC_StreamlineNESD_description_mk1LF050     = Mk-0 Fuel tank with white covering for better aircrafts, rockets and SSTOs fuel balancing. COnly contain Liquid Fuel, for Oxidizer use OX-050 tank
