			#LOC_StreamlineNESD_description_SCB-17drone  = Unknown nerd repair this found on junkyard SCB-1700, and replace some battery cells with autopilot modules from RC-001S. ( no warranties of working, or even simple battery charging abilities ) 
			
			#LOC_StreamlineNESD_description_Int1         = This streamlined circular intake is designed to efficiently channel airflow straight into your engines while minimizing drag and turbulence, making it ideal for high-speed atmospheric flight. Its clean, rounded profile helps maintain smooth airflow across a wide range of velocities, improving engine performance and reducing the chances of flameouts when pushing the limits. Built with a focus on both efficiency and durability, it integrates neatly with fuselage designs and provides reliable air delivery for jet and hybrid engines alike. Whether you’re building a sleek spaceplane or a high-performance aircraft, this intake keeps the air flowing where it matters most—into the engine, not around it.
			#LOC_StreamlineNESD_description_Int2         = A larger version of th eDTE Streamline Circular Intake, designed to efficiently channel airflow straight into your engines while minimizing drag and turbulence, making it ideal for high-speed atmospheric flight. Its clean, rounded profile helps maintain smooth airflow across a wide range of velocities, improving engine performance and reducing the chances of flameouts when pushing the limits. Built with a focus on both efficiency and durability, it integrates neatly with fuselage designs and provides reliable air delivery for jet and hybrid engines alike. Whether you’re building a sleek spaceplane or a high-performance aircraft, this intake keeps the air flowing where it matters most—into the engine, not around it.
			#LOC_StreamlineNESD_description_Int3         = This streamlined inline intake is built to slot cleanly into the fuselage, channeling airflow directly into your engines with minimal drag and maximum efficiency. Its smooth, continuous profile maintains laminar flow along the craft’s body, making it ideal for high-speed designs where every bit of aerodynamic performance counts. By delivering a stable and consistent air supply across a wide range of velocities, it helps keep engines running smoothly and reduces the risk of flameouts under demanding conditions. Perfect for sleek spaceplanes and high-performance aircraft, this intake integrates seamlessly while ensuring your engines get the air they need—right where they need it.
			
			#LOC_StreamlineNESD_description_mk1adapterS1     =  These streamlined fairing sections are designed to sit just ahead of engines, smoothing airflow and keeping everything behind them a little less… on fire. By guiding air cleanly around exposed engine components, they help reduce drag, improve stability at high speeds, and give your craft that sleek, “definitely designed on purpose” look engineers love. Built from lightweight yet durable materials, they can handle the intense conditions near active engines while protecting sensitive parts from heat and turbulence. Whether you’re pushing through thick atmosphere or just trying to make your spaceplane look less like a collection of spare parts, these fairings ensure your engines get the airflow they need—without all the chaos that usually comes with it.  This one comes with one side node
			#LOC_StreamlineNESD_description_mk1adapterS2     =  These streamlined fairing sections are designed to sit just ahead of engines, smoothing airflow and keeping everything behind them a little less… on fire. By guiding air cleanly around exposed engine components, they help reduce drag, improve stability at high speeds, and give your craft that sleek, “definitely designed on purpose” look engineers love. Built from lightweight yet durable materials, they can handle the intense conditions near active engines while protecting sensitive parts from heat and turbulence. Whether you’re pushing through thick atmosphere or just trying to make your spaceplane look less like a collection of spare parts, these fairings ensure your engines get the airflow they need—without all the chaos that usually comes with it.  This one comes with two side nodes, Three variants
