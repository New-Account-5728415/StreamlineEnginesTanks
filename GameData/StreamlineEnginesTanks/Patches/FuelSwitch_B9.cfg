// Note: copied from:  GameData/FuelTanksPlus/PatchManager/ActiveMMPatches/FuelSwitch_B9.cfg


// The B9PartSwitch fuel switching rules are here. Paint-switching rules are in each of the 
// category folders with the parts located there, since each size-class has
// its own set of colors and mesh names.

// NOTE: The "Radial" tanks have the fuel switching configs in their own folder,
// rather than here, since it's more tightly tied to their color switching, etc.


//--------------------------------------------------------------------------------
// Turn on global radial fuel crossfeed, so that it can be switched on per-tank.

@PHYSICSGLOBALS:FOR[FTP_B9PS]
{
	@stack_PriUsesSurf = True
}


//--------------------------------------------------------------------------------
// Set up the tank types we use, if B9 is installed:

B9_TANK_TYPE:NEEDS[B9PartSwitch]
{
	name = FTPOxidizer
	tankMass = 0.000125
	tankCost = 0.0
	RESOURCE
	{
		name = Oxidizer
		unitsPerVolume = 1
	}
}
B9_TANK_TYPE:NEEDS[B9PartSwitch]
{
	name = FTPLiquidFuel
	tankMass = 0.000125
	tankCost = 0.0
	RESOURCE
	{
		name = LiquidFuel
		unitsPerVolume = 1
	}
}
B9_TANK_TYPE:NEEDS[B9PartSwitch]
{
	name = FTPLFO
	tankMass = 0.000125
	tankCost = 0.0
	RESOURCE
	{
		name = LiquidFuel
		unitsPerVolume = 0.45
	}
	RESOURCE
	{
		name = Oxidizer
		unitsPerVolume = 0.55
	}
}
B9_TANK_TYPE:NEEDS[B9PartSwitch]
{
	name = FTPMonoPropellant
	tankMass = 0.0004
	tankCost = 1.5
	RESOURCE
	{
		name = MonoPropellant
		unitsPerVolume = 1.2 // 1.175
	}
}
B9_TANK_TYPE:NEEDS[B9PartSwitch]
{
	name = FTPXenon
	tankMass = 0.0022
	tankCost = 55
	RESOURCE
	{
		name = XenonGas
		unitsPerVolume = 42 // 28
	}
}
B9_TANK_TYPE:NEEDS[B9PartSwitch]
{
	name = FTPOre
	tankMass = 0.00025
	tankCost = 3.0
	RESOURCE
	{
		name = Ore
		unitsPerVolume = 0.2 // 2
	}
}



//--------------------------------------------------------------------------------
// Bulk update tanks with B9PartSwitch:

// for tanks with only LiquedFuel
@PART[nesdmk1*,nesd25*]:HAS[@RESOURCE[LiquidFuel],!MODULE[InterstellarFuelSwitch],!MODULE[FSfuelSwitch],!MODULE[ModuleB9PartSwitch]]:NEEDS[B9PartSwitch&!CryoTanks&!ModularFuelTanks&!RealFuels]
{
    // --- temp values stored in a disposable node ---
    __TMP_FTP_B9PS
    {
        %totalCap = #$../RESOURCE[LiquidFuel]/maxAmount$

        %massOffset = #$../mass$
        @massOffset *= -1
    }	

	MODULE
	{
		name = ModuleB9PartSwitch
		moduleID = fuelSwitch
		switcherDescription = Tank Type
		baseVolume = #$../__TMP_FTP_B9PS/totalCap$

		SUBTYPE
		{
			name = LF/O
			tankType = FTPLFO
			addedMass = #$../../__TMP_FTP_B9PS/massOffset$
		}
		SUBTYPE
		{
			name = LiquidFuel
			tankType = FTPLiquidFuel
			addedMass = #$../../__TMP_FTP_B9PS/massOffset$
		}
		SUBTYPE
		{
			name = Oxidizer
			tankType = FTPOxidizer
			addedMass = #$../../__TMP_FTP_B9PS/massOffset$
		}
		SUBTYPE
		{
			name = MonoPropellant
			tankType = FTPMonoPropellant
			addedMass = #$../../__TMP_FTP_B9PS/massOffset$
		}

	}
	!RESOURCE[LiquidFuel] {}
	!RESOURCE[Oxidizer] {}

    // --- delete the temp node so nothing “lingers” in the final part ---
    !__TMP_FTP_B9PS {}	
}

// for tanks with only oxidizer
@PART[nesdmk1*,nesd25*]:HAS[@RESOURCE[Oxidizer],!MODULE[InterstellarFuelSwitch],!MODULE[FSfuelSwitch],!MODULE[ModuleB9PartSwitch]]:NEEDS[B9PartSwitch&!CryoTanks&!ModularFuelTanks&!RealFuels]
