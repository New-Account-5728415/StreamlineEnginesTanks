//--------------------------------------------------------------------------------

// for tanks with liquid fuel and oxidizer
@PART[nesdmk1*,nesd25*]:HAS[@RESOURCE[LiquidFuel],@RESOURCE[Oxidizer],!MODULE[InterstellarFuelSwitch],!MODULE[FSfuelSwitch],!MODULE[ModuleB9PartSwitch]]:NEEDS[B9PartSwitch&!CryoTanks&!ModularFuelTanks&!RealFuels]
{
    // --- temp values stored in a disposable node ---
    __TMP_FTP_B9PS
    {
        %totalCap = #$../RESOURCE[LiquidFuel]/maxAmount$
        @totalCap += #$../RESOURCE[Oxidizer]/maxAmount$

        %massOffset = #$../mass$
        @massOffset *= -1
    }	

	MODULE
	{
		name = ModuleB9PartSwitch
		moduleID = fuelSwitch
		switcherDescription = Tank Type
		baseVolume = #$../__TMP_FTP_B9PS/totalCap$

		SUBTYPE
		{
			name = LF/O
			tankType = FTPLFO
			addedMass = #$../../__TMP_FTP_B9PS/massOffset$
		}
		SUBTYPE
		{
			name = LiquidFuel
			tankType = FTPLiquidFuel
			addedMass = #$../../__TMP_FTP_B9PS/massOffset$
		}
		SUBTYPE
		{
			name = Oxidizer
			tankType = FTPOxidizer
			addedMass = #$../../__TMP_FTP_B9PS/massOffset$
		}
		SUBTYPE
		{
			name = MonoPropellant
			tankType = FTPMonoPropellant
			addedMass = #$../../__TMP_FTP_B9PS/massOffset$
		}

	}
	!RESOURCE[LiquidFuel] {}
	!RESOURCE[Oxidizer] {}

    // --- delete the temp node so nothing “lingers” in the final part ---
    !__TMP_FTP_B9PS {}	
}
